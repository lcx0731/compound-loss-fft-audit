[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-loss-fft-audit"
version = "0.1.0"
description = "Discretization bounds and FFT aliasing diagnostics for compound insurance losses"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
compound-loss-audit = "loss_audit.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
